<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Paciente - Plano de Saúde</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/common.js"></script>
    <script src="js/paciente-form.js"></script>
</head>
<body>
<header id="cabecalho"></header>
<main>
    <h2 id="titulo">Incluir paciente</h2>
    <div id="msg"></div>
    <form id="form">
        <label>Nome <input id="nome" required></label>
        <label>CPF <input id="cpf" required></label>
        <label>Data de nascimento <input id="dataNascimento" type="date"></label>
        <label>Telefone <input id="telefone"></label>
        <label>Nº da carteirinha <input id="numeroCarteirinha"></label>
        <div class="acoes">
            <button class="btn" type="submit">Salvar</button>
            <a class="btn gray" href="pacientes.html">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
