# Banco H2 em arquivo (os dados persistem em ./data/planosaude.mv.db)
spring.datasource.url=jdbc:h2:file:./data/planosaude
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
# Para MySQL, troque por:
# spring.datasource.url=jdbc:mysql://localhost:3306/planosaude
# spring.datasource.username=root
# spring.datasource.password=senha
# (e troque a dependencia h2 por mysql-connector-j no pom.xml)
