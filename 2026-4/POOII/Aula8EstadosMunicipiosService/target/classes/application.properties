spring.application.name=Aula8EstadosMunicipiosService
server.port=8080

# Banco H2 em memoria (as tabelas sao criadas pelo JPA e populadas a cada start pelos CSVs)
spring.datasource.url=jdbc:h2:mem:estadosdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.show-sql=false
