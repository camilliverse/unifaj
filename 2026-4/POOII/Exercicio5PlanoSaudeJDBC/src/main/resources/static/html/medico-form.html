<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Médico - Plano de Saúde</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/common.js"></script>
    <script src="js/medico-form.js"></script>
</head>
<body>
<header id="cabecalho"></header>
<main>
    <h2 id="titulo">Incluir médico</h2>
    <div id="msg"></div>
    <form id="form">
        <label>Nome <input id="nome" required></label>
        <label>CRM <input id="crm" required></label>
        <label>Especialidade <input id="especialidade"></label>
        <label>Telefone <input id="telefone"></label>
        <div class="acoes">
            <button class="btn" type="submit">Salvar</button>
            <a class="btn gray" href="medicos.html">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
