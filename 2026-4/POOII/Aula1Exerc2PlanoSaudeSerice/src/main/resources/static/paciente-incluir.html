<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Saúde — Incluir Paciente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Plano de Saúde</h1>
    <p class="subtitle">Aluna: Camilli dos Santos | RA: 12529495</p>
    <p class="subtitle">
        <a href="index.html" style="color:#60a5fa;">Início</a> |
        <a href="paciente-listar.html" style="color:#60a5fa;">Pacientes</a> |
        <a href="medico-listar.html" style="color:#60a5fa;">Médicos</a>
    </p>

    <section class="panel">
        <h2>Incluir Paciente</h2>

        <div class="row">
            <div><label for="nome">Nome</label><input id="nome"></div>
            <div><label for="cpf">CPF</label><input id="cpf"></div>
        </div>

        <div class="row">
            <div><label for="telefone">Telefone</label><input id="telefone"></div>
            <div><label for="email">E-mail</label><input id="email"></div>
        </div>

        <div class="row">
            <div><label for="carteirinha">Carteirinha</label><input id="carteirinha"></div>
            <div><label for="nascimento">Nascimento (AAAA-MM-DD)</label><input id="nascimento" type="date"></div>
        </div>

        <button class="btn-primary" onclick="salvar()">Salvar (POST)</button>
        <button class="btn-secondary" onclick="location.href='paciente-listar.html'">Cancelar</button>

        <h3>Resultado</h3>
        <pre class="out" id="out">-</pre>
    </section>
</main>
</body>
</html>
