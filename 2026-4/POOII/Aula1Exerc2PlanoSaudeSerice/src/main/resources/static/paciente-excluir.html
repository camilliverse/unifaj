<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Saúde — Excluir Paciente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Plano de Saúde</h1>
    <p class="subtitle">Aluna: Camilli dos Santos | RA: 12529495</p>
    <p class="subtitle">
        <a href="index.html" style="color:#60a5fa;">Início</a> |
        <a href="paciente-listar.html" style="color:#60a5fa;">Pacientes</a> |
        <a href="medico-listar.html" style="color:#60a5fa;">Médicos</a>
    </p>

    <section class="panel">
        <h2>Excluir Paciente</h2>
        <p style="color:#94a3b8;">Confira os dados antes de confirmar:</p>

        <label for="id">ID</label>
        <input id="id" disabled>

        <div class="row">
            <div><label for="nome">Nome</label><input id="nome" disabled></div>
            <div><label for="cpf">CPF</label><input id="cpf" disabled></div>
        </div>

        <div class="row">
            <div><label for="telefone">Telefone</label><input id="telefone" disabled></div>
            <div><label for="email">E-mail</label><input id="email" disabled></div>
        </div>

        <button class="btn-danger" onclick="excluir()">Confirmar exclusão (DELETE)</button>
        <button class="btn-secondary" onclick="location.href='paciente-listar.html'">Cancelar</button>

        <h3>Resultado</h3>
        <pre class="out" id="out">-</pre>
    </section>
</main>
</body>
</html>
