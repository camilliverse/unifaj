<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Criar Serviço por FORM</title>
</head>
<body>
<h1>Criar serviço por Formulário</h1>

<form action="/api/servicoForm" method="POST">
    ID: <input type="number" name="id" placeholder="ID"><br>
    Nome: <input type="text" name="nome" placeholder="Nome"><br>
    Descrição: <input type="text" name="descr" placeholder="Descrição"><br>
    Valor: <input type="number" name="valor" placeholder="Valor"><br>
    <input type="submit" value="Criar">
</form>

<a href="index.html">Voltar</a>
</body>
</html>
